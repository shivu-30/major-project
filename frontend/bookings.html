<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Local Service Finder | Bookings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="bookings">
  <header class="app-header">
    <nav class="top-nav">
      <a class="brand" href="index.html">Smart Local Service Finder</a>
      <button class="menu-toggle" id="menuToggle" type="button">Menu</button>
      <div class="nav-links" id="navLinks">
        <a href="index.html" data-nav="home">Home</a>
        <a href="search.html" data-nav="search">Search</a>
        <a href="bookings.html" data-nav="bookings">Bookings</a>
        <a href="reviews.html" data-nav="reviews">Reviews</a>
        <a href="ml.html" data-nav="ml">ML Check</a>
        <a href="admin.html" data-nav="admin">Admin</a>
      </div>
      <span id="sessionLabel" class="session-pill">Guest</span>
    </nav>
    <section class="hero compact"><p class="eyebrow">Booking and payment</p><h1>Create bookings and capture test payments.</h1></section>
  </header>
  <main class="page-shell split-layout">
    <section class="card">
      <h2>Create Booking</h2>
      <p class="muted">Login as customer first, then choose a provider and service time.</p>
      <form id="bookingForm">
        <select name="providerId" id="providerSelect" required></select>
        <input name="service" value="Fan installation" placeholder="Service" required />
        <input name="scheduledAt" type="datetime-local" required />
        <input name="address" value="MG Road, Bengaluru" placeholder="Address" required />
        <label class="checkbox"><input type="checkbox" name="emergency" /> Emergency booking</label>
        <button>Create booking</button>
      </form>
    </section>
    <section class="card">
      <div class="section-title"><h2>My Bookings</h2><button id="refreshBookings" class="secondary">Refresh</button></div>
      <div id="bookings"></div>
    </section>
  </main>
  <footer><pre id="output">Bookings and payment responses will appear here.</pre></footer>
  <script src="app.js"></script>
</body>
</html>
