<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Local Service Finder | Reviews</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="reviews">
  <header class="app-header">
    <nav class="top-nav">
      <a class="brand" href="index.html">Smart Local Service Finder</a>
      <button class="menu-toggle" id="menuToggle" type="button">Menu</button>
      <div class="nav-links" id="navLinks">
        <a href="index.html" data-nav="home">Home</a>
        <a href="search.html" data-nav="search">Search</a>
        <a href="bookings.html" data-nav="bookings">Bookings</a>
        <a href="reviews.html" data-nav="reviews">Reviews</a>
        <a href="ml.html" data-nav="ml">ML Check</a>
        <a href="admin.html" data-nav="admin">Admin</a>
      </div>
      <span id="sessionLabel" class="session-pill">Guest</span>
    </nav>
    <section class="hero compact"><p class="eyebrow">Ratings and trust</p><h1>Submit reviews and see moderation status.</h1></section>
  </header>
  <main class="page-shell split-layout">
    <section class="card">
      <h2>Submit Review</h2>
      <form id="reviewForm">
        <select name="providerId" id="reviewProviderSelect" required></select>
        <input name="rating" type="number" min="1" max="5" value="5" required />
        <textarea name="comment" required>Very professional and completed the service on time.</textarea>
        <button>Submit review</button>
      </form>
    </section>
    <section class="card">
      <div class="section-title"><h2>Recent Reviews</h2><button id="refreshReviews" class="secondary">Refresh</button></div>
      <div id="reviews"></div>
    </section>
  </main>
  <footer><pre id="output">Review responses will appear here.</pre></footer>
  <script src="app.js"></script>
</body>
</html>
